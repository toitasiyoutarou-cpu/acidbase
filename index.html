function norm(s){return String(s||'').replace(/[\s　]/g,'').replace(/－/g,'-').replace(/＋/g,'+').replace(/×/g,'*').replace(/→/g,'->').replace(/⇄|↔/g,'<->').replace(/mol\/L/g,'').toLowerCase();}
function ok(ans, arr){let n=norm(ans); return arr.some(a=> n===norm(a) || n.includes(norm(a)) && norm(a).length>1);}
function stars(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)}
function go(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id)); if(id==='record')renderRecord(); if(id==='mistakes')renderMistakes();}
function renderNav(){let items=[['home','ホーム'],['print','授業プリント'],['quest','問題演習Quest'],['mistakes','間違えた問題'],['reflect','振り返り'],['record','学習記録']]; nav.innerHTML=items.map(x=>`<button data-id="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');nav.querySelector('[data-id=home]').classList.add('active');}
function renderHeader(){let total=cloze.length+problems.length, done=Object.keys(state.done).length, rate=Math.round(done/total*100);topRate.textContent=rate+'%';topMeter.style.width=rate+'%';}
function renderHome(){home.innerHTML=`<div class="card"><h2>今日のミッション</h2><div class="questList"><div class="quest" onclick="startCloze('all')"><b>プリント穴埋め10問</b><p class="muted">授業プリントの語句確認</p><span class="tag">基礎</span></div><div class="quest" onclick="startProblems('all')"><b>全問題ランダム</b><p class="muted">13・14の演習をすべて対象</p><span class="tag">演習</span></div><div class="quest" onclick="startProblems('neutral')"><b>中和だけ集中</b><p class="muted">反応式・量的関係</p><span class="tag">苦手対策</span></div></div></div><div class="card"><h2>単元メーター</h2>${Object.entries(units).map(([k,u])=>unitMeter(k,u)).join('')}</div>`;}
function unitMeter(k,u){let all=[...cloze,...problems].filter(x=>x.u===k), d=all.filter(x=>state.done[x.id||'c'+cloze.indexOf(x)]).length, r=all.length?Math.round(d/all.length*100):0; return `<p><b>${u.label}</b> <span class="muted">${u.desc}</span> ${r}%</p><div class="meter"><span style="width:${r}%"></span></div>`}
function renderPrint(){print.innerHTML=`<div class="card"><h2>授業プリント 穴埋め</h2><p class="muted">授業プリントの空欄を自学用に再構成。ここは教員提出なし。自分で確認する練習モードです。</p><div class="printGrid">${Object.entries(units).map(([k,u])=>`<div class="quest" onclick="startCloze('${k}')"><div class="stars">${stars(Math.min(5,Math.max(1,Math.round(cloze.filter(x=>x.u===k).reduce((a,b)=>a+b.lv,0)/(cloze.filter(x=>x.u===k).length||1)))))} </div><h3>${u.label}</h3><p class="muted">${cloze.filter(x=>x.u===k).length}問</p></div>`).join('')}<div class="quest" onclick="startCloze('all')"><h3>全部ランダム</h3><p class="muted">${cloze.length}問</p></div></div><div id="play"></div></div>`;}
function renderQuest(){quest.innerHTML=`<div class="card"><h2>問題演習Quest</h2><p class="muted">13「酸と塩基・水素イオン濃度」19題、14「中和」14題を収録。すべて選択問題です。</p><div class="tabs"><button class="btn primary" onclick="startProblems('all')">全部</button>${Object.entries(units).map(([k,u])=>`<button class="btn ghost" onclick="startProblems('${k}')">${u.label}</button>`).join('')}</div><div id="play2"></div></div>`;}
function startCloze(unit){currentMode='cloze'; currentList=cloze.map((x,i)=>({...x,id:'c'+i})).filter(x=>unit==='all'||x.u===unit).sort(()=>Math.random()-.5); currentIndex=0; hintOpen=0; showQ(); go('print');}
function startProblems(unit){currentMode='problem'; currentList=problems.filter(x=>unit==='all'||x.u===unit).sort(()=>Math.random()-.5); currentIndex=0; hintOpen=0; showQ(); go('quest');}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
function choicesFor(p){
  const bank={acid:['HCl→H+＋Cl-','CH3COOH⇄CH3COO-＋H+','H2SO4→2H+＋SO4^2-','Ca(OH)2→Ca2+＋2OH-','酸','塩基'],ph:['0.10 mol/L','1.0×10^-3 mol/L','1.0×10^-4 mol/L','1.0×10^-7 mol/L','1.0×10^-10 mol/L','1.0×10^-2 mol/L','3','4','7','10','11','12'],neutral:['HCl＋NaOH→NaCl＋H2O','2HCl＋Ca(OH)2→CaCl2＋2H2O','CH3COOH＋NaOH→CH3COONa＋H2O','H2SO4＋2NaOH→Na2SO4＋2H2O','HCl＋NH3→NH4Cl','1 mol','0.05 mol','2 mol','24 g','0.25 mol','30 mL','50 mL'],salt:['正塩','酸性塩','塩基性塩','中性','酸性','塩基性']};
  let correct=p.a[0].replace(/mol\/L/g,' mol/L').replace(/([0-9])mol/g,'$1 mol').replace(/([0-9])g/g,'$1 g').replace(/([0-9])mL/g,'$1 mL');
  let pool=(bank[p.u]||[]).filter(x=>norm(x)!==norm(correct));
  let opts=[correct,...shuffle(pool).slice(0,3)];
  while(opts.length<4) opts.push(['0.10 mol/L','1.0×10^-2 mol/L','2 mol','30 mL','pH=7'][opts.length]);
  return shuffle(opts);
}
function showQ(){let box=currentMode==='cloze'?document.getElementById('play'):document.getElementById('play2'); if(!box)return; let p=currentList[currentIndex]; if(!p){box.innerHTML='<div class="card"><h2>Quest Clear!</h2><button class="btn primary" onclick="go(\'reflect\')">振り返りへ</button></div>';renderHome();return;}
  if(currentMode==='problem'){let opts=choicesFor(p); box.innerHTML=`<div class="card"><div class="row"><span class="tag">${units[p.u].label}</span><span class="stars">${stars(p.lv)}</span><span class="muted">${currentIndex+1}/${currentList.length}</span></div><div class="problem">${p.q}</div><div class="printGrid">${opts.map(o=>`<button class="choice" onclick="checkChoice(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div class="row"><button class="btn ghost" onclick="showHint()">ヒント</button><button class="btn ghost" onclick="skipQ()">次へ</button></div><div id="hint"></div><div id="fb"></div></div>`; return;}
  box.innerHTML=`<div class="card"><div class="row"><span class="tag">授業プリント</span><span class="tag">提出なし</span><span class="stars">${stars(p.lv)}</span><span class="muted">${currentIndex+1}/${currentList.length}</span></div><div class="problem">${p.q.replace('（　）','<span class="blank">？</span>')}</div><input class="answer" id="ans" placeholder="空欄に入る語句を入力"><div class="row"><button class="btn primary" onclick="checkAns()">自己チェック</button><button class="btn ghost" onclick="showHint()">ヒント</button><button class="btn ghost" onclick="skipQ()">次へ</button></div><div id="hint"></div><div id="fb"></div></div>`; setTimeout(()=>ans.focus(),50); ans.onkeydown=e=>{if(e.key==='Enter')checkAns()};}
function showHint(){let p=currentList[currentIndex]; hint.innerHTML=`<div class="hint">${p.h||'価数・濃度・電離度のどれを使うか確認。'}</div>`;}
function checkChoice(btn,enc){let p=currentList[currentIndex], val=decodeURIComponent(enc); let good=ok(val,p.a); document.querySelectorAll('#play2 .choice').forEach(b=>b.disabled=true); if(good){btn.style.borderColor='#2ec4b6';state.done[p.id]=true; delete state.wrong[p.id]; fb.innerHTML=`<div class="feedback ok">正解！ <details><summary>解説</summary>${p.ex||''}</details></div>`;}else{btn.style.borderColor='#ff6b6b';state.wrong[p.id]=p.q; fb.innerHTML=`<div class="feedback ng">不正解。<details open><summary>解説</summary>${p.ex||''}<br><b>正解：</b>${p.a[0]}</details></div>`;} save();}
function checkAns(){let p=currentList[currentIndex], val=ans.value; let good=ok(val,p.a); if(good){state.done[p.id]=true; delete state.wrong[p.id]; fb.innerHTML=`<div class="feedback ok">正解！ ${p.ex?'<details><summary>解説</summary>'+p.ex+'</details>':''}<p class="muted small">この穴埋めは自学用で、提出データにはしません。</p></div>`;}else{state.wrong[p.id]=p.q; fb.innerHTML=`<div class="feedback ng">もう一度。<details open><summary>ヒント・解説</summary>${p.h||''}<br>${p.ex||''}<br><b>答え例：</b>${p.a[0]}</details></div>`;} save();}
function skipQ(){currentIndex++; showQ();}
function renderMistakes(){let ids=Object.keys(state.wrong); mistakes.innerHTML=`<div class="card"><h2>間違えた問題</h2>${ids.length?'<div class="questList">'+ids.map(id=>`<div class="quest"><b>${id}</b><p>${state.wrong[id]}</p></div>`).join('')+'</div><button class="btn primary" onclick="startWrong()">間違いだけ解く</button>':'<p class="muted">まだありません。</p>'}</div>`;}
function startWrong(){let ids=Object.keys(state.wrong); currentMode='problem'; currentList=problems.concat(cloze.map((x,i)=>({...x,id:'c'+i}))).filter(x=>ids.includes(x.id)); currentIndex=0; showQ(); go('quest');}
function renderReflect(){reflect.innerHTML=`<div class="card"><h2>振り返り</h2><p class="muted">授業後・家庭学習後に1分で記録。</p><label>今日の理解度</label><div class="row"><button class="choice" onclick="setLevel('まだ不安')">まだ不安</button><button class="choice" onclick="setLevel('普通')">普通</button><button class="choice" onclick="setLevel('説明できる')">説明できる</button></div><input type="hidden" id="rLevel" value="普通"><p>今日わかったこと</p><textarea id="rGood"></textarea><p>まだわからないこと</p><textarea id="rBad"></textarea><button class="btn primary" onclick="saveReflect()">保存</button><div id="rMsg"></div></div>`;}
function setLevel(v){rLevel.value=v; document.querySelectorAll('.choice').forEach(c=>c.style.borderColor=c.textContent===v?'#4aa3df':'#dbe9f5')}
function saveReflect(){state.reflect.push({date:new Date().toLocaleString(),level:rLevel.value,good:rGood.value,bad:rBad.value}); save(); rMsg.innerHTML='<div class="feedback ok">保存しました。</div>';}
function renderRecord(){let total=cloze.length+problems.length, done=Object.keys(state.done).length, wrong=Object.keys(state.wrong).length;record.innerHTML=`<div class="card"><h2>学習記録</h2><div class="stats"><div class="stat"><div class="num">${done}</div><div>完了</div></div><div class="stat"><div class="num">${total}</div><div>総問題</div></div><div class="stat"><div class="num">${wrong}</div><div>苦手</div></div><div class="stat"><div class="num">${state.reflect.length}</div><div>振り返り</div></div></div><h3>振り返り履歴</h3>${state.reflect.slice().reverse().map(r=>`<details><summary>${r.date}｜${r.level}</summary><b>わかったこと</b><p>${esc(r.good)}</p><b>まだわからないこと</b><p>${esc(r.bad)}</p></details>`).join('')||'<p class="muted">まだありません。</p>'}</div>`;}
function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function exportCSV(){let rows=[['※授業プリント穴埋めは自学用・提出なし'],[],['date','level','good','bad'],...state.reflect.map(r=>[r.date,r.level,r.good,r.bad]),[],['done_problem_ids',Object.keys(state.done).filter(id=>!id.startsWith('c')).join(' ')],['wrong_problem_ids',Object.keys(state.wrong).filter(id=>!id.startsWith('c')).join(' ')]]; let csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='chemquest_record.csv'; a.click();}
function resetAll(){if(confirm('学習記録をリセットしますか？')){state={done:{},wrong:{},reflect:[]};save();renderHome();renderRecord();}}
renderNav();renderHeader();renderHome();renderPrint();renderQuest();renderReflect();
</script>
</body>
</html>
