function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function go(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id)); if(id==='home')renderHome(); if(id==='print')renderPrint(); if(id==='quest')renderQuest(); if(id==='mistakes')renderMistakes(); if(id==='reflect')renderReflect(); if(id==='record')renderRecord();}
function renderNav(){nav.innerHTML=[['home','ホーム'],['print','授業プリント'],['quest','問題演習Quest'],['mistakes','間違えた問題'],['reflect','振り返り'],['record','学習記録']].map(x=>`<button data-id="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');nav.querySelector('[data-id=home]').classList.add('active');}
function allItems(){return [...cloze,...problems]}
function renderHeader(){let total=allItems().length,done=Object.keys(state.done).length,rate=total?Math.round(done/total*100):0;topRate.textContent=rate+'%';topMeter.style.width=rate+'%';}
function unitMeter(k){let items=allItems().filter(x=>x.unit===k),d=items.filter(x=>state.done[x.id]).length,r=items.length?Math.round(d/items.length*100):0;return `<div class="progressLine"><b>${units[k].label}</b><div class="meter"><span style="width:${r}%"></span></div><span>${r}%</span></div>`}
function avgLevel(arr){return arr.length?arr.reduce((a,b)=>a+b.level,0)/arr.length:1}
function renderHome(){home.innerHTML=`<div class="card"><h2>今日のミッション</h2><div class="questList"><div class="quest" onclick="startPrint('all')"><b>授業プリント穴埋め 全部</b><p class="muted">46ページ分の主要空欄・確認事項。</p><span class="tag">${cloze.length}問</span></div><div class="quest" onclick="startProblems('all')"><b>問題演習 全問</b><p class="muted">プリント内練習＋13・14の演習。</p><span class="tag">${problems.length}問</span></div><div class="quest" onclick="go('mistakes')"><b>間違い直し</b><p class="muted">苦手だけ再挑戦。</p><span class="tag">復習</span></div></div></div><div class="card"><h2>単元メーター</h2>${Object.keys(units).map(unitMeter).join('')}</div>`;}

const printUnitInfo={
  acid:{title:'1　酸・塩基　教 p.134〜141',goals:['塩化水素や硫酸，アンモニアや水酸化ナトリウムに共通する性質を理解する。','酸・塩基の定義と分類を理解する。'],lead:'酸性・塩基性の性質から入り，アレーニウスの定義，ブレンステッド・ローリーの定義，価数，強弱までを整理する。'},
  ph:{title:'2　水の電離と水溶液のpH　教 p.142〜147',goals:['H+とOH−の間にどのような関係があるか理解する。','水溶液の酸性や塩基性の強さを表す方法を知る。'],lead:'水の電離，水のイオン積，pHの求め方を，式と意味を結びつけて学習する。'},
  neutral:{title:'3　中和反応　教 p.148〜156',goals:['酸と塩基が反応し，お互いの性質を打ち消す反応を理解する。','中和の量的関係，中和滴定，器具の扱いを理解する。'],lead:'H+とOH−の物質量が等しくなることを軸に，反応式と計算をつなげる。'},
  salt:{title:'4　塩　教 p.157〜159',goals:['塩の分類と水溶液の性質を理解する。','加水分解や弱酸・弱塩基の遊離を理解する。'],lead:'酸と塩基の反応後にできる塩を，化学式中に残るHやOH，水溶液の性質から整理する。'},
  advanced:{title:'発展　滴定・環境',goals:['二段滴定，逆滴定，酸性雨などを発展内容として確認する。'],lead:'基礎を使って，より複雑な滴定や身近な現象を考える。'}
};
function renderPrint(){
  const sec=document.getElementById('print');
  const revealed=Object.keys(state.revealed||{}).length;
  const unitKeys=Object.keys(units).filter(k=>cloze.some(x=>x.unit===k));
  const unitButtons=unitKeys.map(k=>`<button class="btn ghost mini" onclick="scrollToPrintUnit('${k}')">${units[k].label}</button>`).join('');
  const sheets=unitKeys.map(k=>renderPrintSheet(k)).join('');
  sec.innerHTML=`<div class="card"><h2>授業プリント</h2><p class="printNote">プリントをPDF画像ではなく，本文形式で再構成しました。文章を読みながら，青い空欄をクリックすると答えが表示されます。提出なしの自学用です。</p><div class="row"><button class="btn primary" onclick="showAllPrintAnswers()">答えを全部表示</button><button class="btn ghost" onclick="hideAllPrintAnswers()">答えを全部隠す</button><button class="btn warn" onclick="startPrint('all')">全範囲を4択Quest</button></div><div class="jumpList" style="margin-top:10px">${unitButtons}</div><p class="muted mini">表示済み：<span id="revealedCount">${revealed}</span> / ${cloze.length}</p></div><div id="playPrint"></div>${sheets}`;
}
function renderPrintSheet(k){
  const info=printUnitInfo[k]||{title:units[k].label,goals:[],lead:units[k].desc};
  const items=cloze.filter(x=>x.unit===k);
  const bySection={};
  items.forEach(it=>{(bySection[it.section]||(bySection[it.section]=[])).push(it)});
  const sections=Object.keys(bySection).map(secName=>`<h3>${esc(secName)}</h3>${sectionLead(secName)}${bySection[secName].map(renderPrintLine).join('')}`).join('');
  return `<article id="printUnit_${k}" class="printSheet"><h2>${esc(info.title)}</h2><p class="printLead">${esc(info.lead)}</p><div class="goalBox"><b>〇単元の目標</b>${info.goals.map((g,i)=>`<br>${i+1}　${esc(g)}`).join('')}</div><div class="row"><button class="btn ghost" onclick="startPrint('${k}')">この範囲を4択Quest</button><span class="tag">${items.length}項目</span></div>${sections}</article>`;
}
function sectionLead(name){
  const map={
    '1 酸・塩基':'<p class="printLead">酸性・塩基性の性質を，リトマス紙，金属との反応，例となる物質から確認する。</p>',
    'アレーニウスの定義':'<p class="printLead">水溶液中で生じるイオンに注目して，酸と塩基を定義する。</p>',
    'ブレンステッド・ローリー':'<p class="printLead">水素イオンH+の授受に注目して，酸と塩基を考える。</p>',
    '酸・塩基の価数':'<p class="printLead">酸はH+になれるHの数，塩基は生じるOH−または受け取れるH+の数で価数を考える。</p>',
    '酸・塩基の強弱':'<p class="printLead">強弱は電離度で判断する。価数の大小とは無関係である。</p>',
    '水の電離':'<p class="printLead">純水もごくわずかに電離しており，25℃では[H+]と[OH−]が等しい。</p>',
    '水のイオン積':'<p class="printLead">[H+][OH−]は一定温度で一定となり，25℃では1.0×10^-14である。</p>',
    'pH':'<p class="printLead">水素イオン濃度を見やすく表した数値がpHである。</p>',
    '中和反応':'<p class="printLead">酸のH+と塩基のOH−が結びつき，水ができる反応を中和という。</p>',
    '中和の量的関係':'<p class="printLead">過不足なく中和するとき，酸から生じるH+の物質量と塩基から生じるOH−の物質量が等しい。</p>',
    '塩の分類':'<p class="printLead">塩は，化学式中に酸のHや塩基のOHが残っているかどうかで分類する。</p>'
  };
  return map[name]||'';
}
function renderPrintLine(it){
  let txt=esc(it.q);
  const blank=`<button class="revealBlank" data-id="${it.id}" onclick="revealPrintAnswer('${it.id}',this)">　　　</button>`;
  txt=txt.replace(/（\s*　?\s*）|\(\s*\)/,`（${blank}）`);
  if(txt.indexOf('revealBlank')<0){txt += `　${blank}`;}
  return `<p class="worksheetLine"><span class="tag">${it.id}</span><span class="stars">${stars(it.level)}</span>　${txt}${it.hint?`<details><summary>ヒント</summary>${esc(it.hint)}</details>`:''}</p>`;
}
function revealPrintAnswer(id,el){
  const item=cloze.find(x=>x.id===id); if(!item)return;
  el.textContent=item.answer; el.classList.add('shown');
  state.revealed=state.revealed||{}; state.revealed[id]=true; save();
  const c=document.getElementById('revealedCount'); if(c)c.textContent=Object.keys(state.revealed).length;
}
function showAllPrintAnswers(){document.querySelectorAll('.revealBlank').forEach(el=>revealPrintAnswer(el.dataset.id,el));}
function hideAllPrintAnswers(){document.querySelectorAll('.revealBlank').forEach(el=>{el.textContent='　　　';el.classList.remove('shown')}); state.revealed={}; save(); const c=document.getElementById('revealedCount'); if(c)c.textContent=0;}
function scrollToPrintUnit(k){document.getElementById('printUnit_'+k)?.scrollIntoView({behavior:'smooth',block:'start'});}
function renderQuest(){let grouped=Object.keys(units).map(k=>`<button class="btn ghost" onclick="startProblems('${k}')">${units[k].label} ${problems.filter(x=>x.unit===k).length}問</button>`).join('');quest.innerHTML=`<div class="card"><h2>問題演習Quest</h2><p class="muted">問題はすべて選択問題。各問ごとに選択肢を作成。</p><div class="tabs"><button class="btn primary" onclick="startProblems('all')">全部</button>${grouped}</div><div id="playQuest"></div></div>`;}
function startPrint(unit){mode='print';current=shuffle(cloze.filter(x=>unit==='all'||x.unit===unit));idx=0;go('print');show();}
function startProblems(unit){mode='problem';current=shuffle(problems.filter(x=>unit==='all'||x.unit===unit));idx=0;go('quest');show();}
function startWrong(){let ids=Object.keys(state.wrong);mode='problem';current=allItems().filter(x=>ids.includes(x.id));idx=0;go('quest');show();}
function show(){let box=document.getElementById(mode==='print'?'playPrint':'playQuest');if(!box)return;let p=current[idx];if(!p){box.innerHTML=`<div class="card"><h2>Quest Clear!</h2><p class="muted">おつかれさま。振り返りへ進めます。</p><button class="btn primary" onclick="go('reflect')">振り返りへ</button></div>`;renderHome();return;}let opts=shuffle(p.choices||[]);box.innerHTML=`<div class="card"><div class="row"><span class="tag">${mode==='print'?'授業プリント｜提出なし':'問題演習'}</span><span class="tag">${units[p.unit].label}</span><span class="tag">${esc(p.section||'')}</span><span class="stars">${stars(p.level)}</span><span class="muted">${idx+1}/${current.length}</span></div><div class="problem">${mode==='print'?esc(p.q).replace('（　）','<span class="blank">？</span>'):esc(p.q)}</div><div class="printGrid">${opts.map(o=>`<button class="choice" onclick="choose(this, ${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div><div class="row"><button class="btn ghost" onclick="showHint()">ヒント</button><button class="btn ghost" onclick="nextQ()">次へ</button></div><div id="hint"></div><div id="fb"></div></div>`;}
function choose(btn,val){let p=current[idx],good=val===p.answer;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(good){btn.classList.add('correct');state.done[p.id]=true;delete state.wrong[p.id];fb.innerHTML=`<div class="feedback ok">正解！${p.ex?`<details><summary>解説</summary>${esc(p.ex)}</details>`:''}</div>`;}else{btn.classList.add('wrong');state.wrong[p.id]=p.q;document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===p.answer)b.classList.add('correct')});fb.innerHTML=`<div class="feedback ng">不正解。正解は「${esc(p.answer)}」。${p.ex?`<details open><summary>解説</summary>${esc(p.ex)}</details>`:''}</div>`;}save();}
function showHint(){let p=current[idx];hint.innerHTML=`<div class="hint">${esc(p.hint||'酸・塩基の定義、価数、電離度、Kw、中和の量的関係のどれを使うか確認。')}</div>`}
function nextQ(){idx++;show();}
function renderMistakes(){let ids=Object.keys(state.wrong);mistakes.innerHTML=`<div class="card"><h2>間違えた問題</h2>${ids.length?`<div class="questList">${ids.map(id=>`<div class="quest"><b>${id}</b><p>${esc(state.wrong[id])}</p></div>`).join('')}</div><button class="btn primary" onclick="startWrong()">間違いだけ解く</button>`:'<p class="muted">まだありません。</p>'}</div>`}
function renderReflect(){reflect.innerHTML=`<div class="card"><h2>振り返り</h2><p class="muted">自分用メモとして保存。</p><select id="rLevel" class="select"><option>まだ不安</option><option selected>普通</option><option>説明できる</option></select><p>今日わかったこと</p><textarea id="rGood"></textarea><p>まだわからないこと</p><textarea id="rBad"></textarea><button class="btn primary" onclick="saveReflect()">保存</button><div id="rMsg"></div></div>`;}
function saveReflect(){state.reflect.push({date:new Date().toLocaleString(),level:rLevel.value,good:rGood.value,bad:rBad.value});save();rMsg.innerHTML='<div class="feedback ok">保存しました。</div>'}
function renderRecord(){let total=allItems().length,done=Object.keys(state.done).length,wrong=Object.keys(state.wrong).length;record.innerHTML=`<div class="card"><h2>学習記録</h2><div class="stats"><div class="stat"><div class="num">${done}</div><div>完了</div></div><div class="stat"><div class="num">${total}</div><div>総問題</div></div><div class="stat"><div class="num">${wrong}</div><div>苦手</div></div><div class="stat"><div class="num">${state.reflect.length}</div><div>振り返り</div></div></div><h3>単元別</h3>${Object.keys(units).map(unitMeter).join('')}<h3>振り返り履歴</h3>${state.reflect.slice().reverse().map(r=>`<details><summary>${esc(r.date)}｜${esc(r.level)}</summary><b>わかったこと</b><p>${esc(r.good)}</p><b>まだわからないこと</b><p>${esc(r.bad)}</p></details>`).join('')||'<p class="muted">まだありません。</p>'}</div>`;}
function exportCSV(){let rows=[['mode','id','status'],...Object.keys(state.done).map(id=>[id.startsWith('P')?'print':'problem',id,'done']),...Object.keys(state.wrong).map(id=>[id.startsWith('P')?'print':'problem',id,'wrong']),[],['date','level','good','bad'],...state.reflect.map(r=>[r.date,r.level,r.good,r.bad])];let csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='chemquest_record.csv';a.click();}
function resetAll(){if(confirm('学習記録をリセットしますか？')){state={done:{},wrong:{},reflect:[]};save();renderHome();renderRecord();}}
renderNav();renderHeader();renderHome();renderPrint();renderQuest();renderReflect();
</script></body></html>
